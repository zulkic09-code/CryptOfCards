<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypt of Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9dc;--panel:#fbf7ee;--ink:#2a2420;--mute:#6f655a;--line:#cfc4b0;--atk:#a8432f;--blk:#3d6a8a;--utl:#5d7a3c;--gold:#b5832a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191d;--panel:#23262c;--ink:#ece4d4;--mute:#9a9284;--line:#3a3e46;--atk:#e0775f;--blk:#6fa4c8;--utl:#9bbd6f;--gold:#e0b25a}}
:root[data-theme="dark"]{--bg:#17191d;--panel:#23262c;--ink:#ece4d4;--mute:#9a9284;--line:#3a3e46;--atk:#e0775f;--blk:#6fa4c8;--utl:#9bbd6f;--gold:#e0b25a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Alegreya,Georgia,serif;font-size:18px}
main{max-width:760px;margin:0 auto;padding:16px}
h1,h2{font-family:"Pirata One",Georgia,serif;font-weight:400;margin:0;letter-spacing:.02em}
h1{font-size:2.2rem}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.mute{color:var(--mute)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
.foe{display:flex;gap:14px;align-items:center}
.face{font-size:3.4rem;line-height:1}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--atk)}
.bar.me i{background:var(--utl)}
.intent{font-weight:700}
.me-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.stat{font-weight:700}
.hand{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.card{flex:1 1 120px;max-width:150px;min-height:128px;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-top:6px solid var(--utl);border-radius:8px;padding:8px;cursor:pointer}
.card.atk{border-top-color:var(--atk)}.card.blk{border-top-color:var(--blk)}
.card b{display:block;font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:1.15rem}
.card .cost{float:right;background:var(--ink);color:var(--bg);border-radius:50%;width:24px;height:24px;text-align:center;font-weight:700;font-size:.95rem;line-height:24px}
.card span.d{font-size:.92rem;color:var(--mute);display:block;margin-top:6px}
.card:disabled{opacity:.4;cursor:not-allowed}
.card:not(:disabled):hover,.card:focus-visible{border-color:var(--gold);outline:none}
button.btn{font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.log{min-height:3.2em;color:var(--mute);font-size:.95rem}
.center{text-align:center;padding:24px 8px}
.center h2{font-size:2.4rem;margin-bottom:8px}
input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;width:100%;max-width:280px}
input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
.cls{font:inherit;color:var(--ink);text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cls b{font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:1.5rem}
.cls .face{font-size:2.4rem}
.cls .d{font-size:.92rem;color:var(--mute)}
.cls.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.cls:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.path{display:flex;flex-direction:column;align-items:center;margin:14px 0}
.dg{width:100%;max-width:440px;display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.dg .face{font-size:2.2rem}
.dg b{font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:1.35rem;display:block}
.dg .d{display:block;font-size:.92rem;color:var(--mute)}
.dg.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.dg.lock{opacity:.5}
.dg.done{border-style:dashed}
.link{height:22px;border-left:3px dotted var(--line)}
.card small{display:block;font-size:.8rem;color:var(--mute);margin-top:2px}
.card.uncommon{box-shadow:0 0 0 2px var(--blk)}
.card.rare{box-shadow:0 0 0 2px var(--gold)}
.card.rare small{color:var(--gold);font-weight:700}
.card.used{opacity:.45}
.card.sel{outline:3px solid var(--gold);outline-offset:1px}
.card.mini{min-height:0;flex:0 1 130px}
.card.mini:disabled{opacity:.8;cursor:default}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.stage.active{border:2px solid var(--gold);box-shadow:0 0 0 2px var(--gold)}
:root{--rb:#8a8f98;--rc:#3b73b9;--ru:#7b4fb3;--rr:#b5832a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rb:#9aa0a8;--rc:#5b95d6;--ru:#a47fd9;--rr:#e0b25a}}
:root[data-theme="dark"]{--rb:#9aa0a8;--rc:#5b95d6;--ru:#a47fd9;--rr:#e0b25a}
.card{border-top-width:12px}
.card.basic{border-top-color:var(--rb)}
.card.common{border-top-color:var(--rc)}
.card.uncommon{border-top-color:var(--ru);box-shadow:none}
.card.rare{border-top-color:var(--rr);box-shadow:none}
.card.basic:not(:disabled):hover,.card.basic:focus-visible{border-top-color:var(--rb)}
.card.common:not(:disabled):hover,.card.common:focus-visible{border-top-color:var(--rc)}
.card.uncommon:not(:disabled):hover,.card.uncommon:focus-visible{border-top-color:var(--ru)}
.card.rare:not(:disabled):hover,.card.rare:focus-visible{border-top-color:var(--rr)}
.ico{display:block;font-size:1.05rem;margin-top:2px}
:root{--hy:#d9a21b;--hr:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hy:#e8c04a;--hr:#e8624f}}
:root[data-theme="dark"]{--hy:#e8c04a;--hr:#e8624f}
.bar.me{height:16px}
.bar.me i{transition:width .3s}
.bar.me i.warn{background:var(--hy)}
.bar.me i.low{background:var(--hr)}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sb{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.sb b{display:block;font-size:1.4rem}
.sb span{font-size:.85rem;color:var(--mute)}
button.btn.wide{display:block;width:100%;padding:14px;font-size:1.1rem;margin-bottom:16px}
@media (prefers-reduced-motion:reduce){.bar.me i{transition:none}}
.bar.armor{height:10px;margin-bottom:6px;border:1px solid var(--mute)}
.bar.armor i{background:#fff;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar.armor i{transition:none}}
.bar.armor{margin-bottom:10px}
.card.used,.card.used:disabled{position:relative;opacity:1;transform:scale(.95);cursor:default}
.card.used::before{content:"";position:absolute;inset:0;background:var(--panel);opacity:.7;border-radius:6px}
.card.used::after{content:"PLAYED";position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) rotate(-14deg);font-family:"Pirata One",Georgia,serif;font-size:1.35rem;letter-spacing:.08em;color:var(--atk);background:var(--panel);border:3px solid var(--atk);border-radius:6px;padding:0 10px}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.splash h1{font-size:clamp(2.8rem,10vw,4.5rem)}
.howto{padding-left:1.2rem;margin:8px 0 0}
.howto li{margin:8px 0}
.lore{max-width:34rem;font-style:italic;line-height:1.5;margin:0}
.pic{width:108px;height:108px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:none;background:var(--bg)}
.dpic{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:#000}
.dpic.big{width:180px;height:180px;margin-bottom:12px}
.dg.lock .dpic{filter:grayscale(1)}
.stage.center .lore{margin:0 auto}
.skulls{white-space:nowrap}
.sk{width:18px;height:18px;vertical-align:-4px;margin-left:2px}
:root{--upg:#8a6014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--upg:#f0c060}}
:root[data-theme="dark"]{--upg:#f0c060}
.card .d .up{color:var(--upg);font-weight:700}
.sym{width:24px;height:24px;vertical-align:middle;margin-right:2px}
.cpic{width:84px;height:84px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var CARDS={
strike:{n:"Strike",c:1,t:"atk",d:"Deal 6 damage.",f:function(s){hit(6+s.str)}},
defend:{n:"Defend",c:1,t:"blk",d:"Gain 3 armour.",f:function(s){s.blk+=3}},
stab:{n:"Quick Stab",c:1,t:"atk",d:"Deal 4 damage. Pull 1 card from your deck into your hand for this turn.",f:function(s){hit(4+s.str);draw(1)}},
smash:{n:"Smash",c:2,t:"atk",d:"Deal 12 damage.",f:function(s){hit(12+s.str)}},
fire:{n:"Fireball",c:2,t:"atk",d:"Deal 16 damage.",f:function(s){hit(16+s.str)}},
drain:{n:"Drain",c:1,t:"atk",d:"Deal 5 damage. Heal 3.",f:function(s){hit(5+s.str);heal(3)}},
wall:{n:"Iron Wall",c:2,t:"blk",d:"Gain 8 armour.",f:function(s){s.blk+=8}},
cry:{n:"Battle Cry",c:1,t:"utl",d:"Gain 2 strength this fight.",f:function(s){s.str+=2}},
focus:{n:"Focus",c:1,t:"utl",d:"Gain 2 armour. Pull 2 cards from your deck into your hand for this turn.",f:function(s){s.blk+=2;draw(2)}},
twin:{n:"Twin Strike",c:1,t:"atk",d:"Deal 4 damage twice.",f:function(s){hit(4+s.str);hit(4+s.str)}}
};
(function(){var r={strike:"basic",defend:"basic",stab:"common",twin:"common",focus:"common",drain:"common",smash:"uncommon",wall:"uncommon",cry:"uncommon",fire:"uncommon"};for(var k in r)CARDS[k].r=r[k]})();
CARDS.bash={n:"Shield Bash",c:1,t:"atk",r:"common",d:"Deal 4 damage. Gain 3 armour.",f:function(s){hit(4+s.str);s.blk+=3}};
CARDS.reck={n:"Reckless Swing",c:1,t:"atk",r:"uncommon",d:"Deal 12 damage. Lose 4 health.",f:function(s){hit(12+s.str);G.hp=Math.max(1,G.hp-4)}};
CARDS.meteor={n:"Meteor",c:3,t:"atk",r:"rare",x:1,d:"Deal 30 damage. Lost for good.",f:function(s){hit(30+s.str)}};
CARDS.heart={n:"Phoenix Heart",c:1,t:"utl",r:"rare",x:1,d:"Heal 12. Lost for good.",f:function(s){heal(12)}};
CARDS.rage={n:"Berserk",c:0,t:"utl",r:"rare",x:1,d:"Gain 4 strength. Lost for good.",f:function(s){s.str+=4}};
CARDS.fort={n:"Fortress",c:2,t:"blk",r:"rare",x:1,d:"Gain 15 armour. Lost for good.",f:function(s){s.blk+=15}};
var REWARDS=Object.keys(CARDS).filter(function(k){return CARDS[k].r!="basic"});
var DUNGEONS=[
{n:"Rat Cellar",e:"🕳️",t:"Damp, dark and squeaky.",rooms:[
{n:"Giant Rat",e:"🐀",hp:20,m:[["a",5],["a",6],["a",4]]},
{n:"Rat King",e:"👑",hp:30,m:[["a",7],["b",6],["a",9]]}]},
{n:"Slime Caverns",e:"🟢",t:"Everything here is sticky.",rooms:[
{n:"Green Slime",e:"🟢",hp:28,m:[["a",6],["a",7],["a",8]]},
{n:"Ooze Mother",e:"🦠",hp:40,m:[["a",9],["b",8],["a",11]]}]},
{n:"Bone Crypt",e:"⚰️",t:"The dead do not rest.",rooms:[
{n:"Skeleton",e:"💀",hp:35,m:[["a",8],["a",9],["a",10]]},
{n:"Wraith",e:"👻",hp:40,m:[["a",9],["a",11],["a",8]]},
{n:"Bone Lord",e:"🦴",hp:52,m:[["a",11],["b",10],["a",14]]}]},
{n:"Lich’s Tower",e:"🏰",t:"The final climb.",rooms:[
{n:"Ogre",e:"👹",hp:50,m:[["a",12],["a",9],["a",10]]},
{n:"Gargoyle",e:"🗿",hp:55,m:[["a",10],["a",11],["a",13]]},
{n:"The Lich",e:"🧙",hp:66,m:[["a",10],["b",10],["a",14],["a",7],["a",16]]}]}
];
var G,S,app=document.getElementById("app");
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var CLASSES=[
{id:"Warrior",e:"🛡️",hp:50,en:3,hs:5,b0:3,str0:0,perk:"Starts every fight with 3 armour.",deck:["strike","strike","strike","strike","defend","defend","defend","defend","smash","cry"]},
{id:"Rogue",e:"🗡️",hp:36,en:3,hs:5,b0:0,str0:1,perk:"Starts every fight with 1 strength.",deck:["strike","strike","strike","defend","defend","defend","stab","stab","twin","focus"]},
{id:"Mage",e:"🔮",hp:30,en:3,hs:5,x0:1,b0:0,str0:0,perk:"Carries 6 cards instead of 5.",deck:["strike","strike","strike","defend","defend","defend","fire","drain","focus"]}
];
var pc=0,pname="";
function cleanName(){var e=document.getElementById("nm");return e?e.value.replace(/[<>&"']/g,"").slice(0,14):pname}
function sel(i){pname=cleanName();pc=i;creation()}
function newRun(){creation()}
function creation(){pname=cleanName();
var h='<div class="top"><h1>Crypt of Cards</h1><span class="mute">Create your hero</span></div><div class="stage"><label for="nm"><b>Name</b></label><br><input id="nm" maxlength="14" placeholder="Hero" value="'+pname+'"></div><div class="classes">';
CLASSES.forEach(function(c,i){var cnt={};c.deck.forEach(function(d){cnt[d]=(cnt[d]||0)+1});var dk=Object.keys(cnt).map(function(d){return cnt[d]+"× "+CARDS[d].n}).join(", ");
h+='<button class="cls'+(i==pc?' on':'')+'" onclick="sel('+i+')" aria-pressed="'+(i==pc)+'">'+cicon(c)+'<b>'+c.id+'</b><span class="d">Health '+c.hp+' · Energy '+c.en+' · Hand '+c.hs+'</span><span class="d"><i>'+c.perk+'</i></span><span class="d">'+dk+'</span></button>'});
app.innerHTML=h+'</div><button class="btn" onclick="begin()">Enter the crypt</button>'}
function begin(){var c=CLASSES[pc];pname=cleanName().trim()||"Hero";G={name:pname,cls:c.id,hp:c.hp,max:c.hp,en:c.en,hs:c.hs,x0:c.x0||0,b0:c.b0,str0:c.str0,d:0,r:0,msg:"Five dungeons guard the fragments of an ancient seal. Fight your way through them all.",deck:c.deck.slice()};showMap()}
function fight(){var D=DUNGEONS[G.d],f=D.rooms[G.r];S={foe:f,fhp:Math.round(f.hp*1.3),mx:Math.round(f.hp*1.3),exh:[],fblk:0,blk:G.b0,str:G.str0,en:G.en,draw:shuffle(G.deck.slice()),hand:[],disc:[],log:"A "+f.n+" blocks your path.",over:null};pick();draw(G.hs+(G.x0||0));render()}
function pick(){var m=S.foe.m,x=m[Math.floor(Math.random()*m.length)];S.intent=[x[0],Math.round(x[1]*1.2)]}
function draw(n){for(var i=0;i<n;i++){if(!S.draw.length){S.draw=shuffle(S.disc);S.disc=[]}if(S.draw.length)S.hand.push(S.draw.pop())}}
function hit(n){var a=Math.max(0,n-S.fblk);S.fblk=Math.max(0,S.fblk-n);S.fhp-=a}
function heal(n){G.hp=Math.min(G.max,G.hp+n)}
function play(i){var id=S.hand[i],c=CARDS[id];if(c.c>S.en||S.over)return;S.en-=c.c;S.hand.splice(i,1);(c.x?S.exh:S.disc).push(id);if(c.x){var q=G.deck.indexOf(id);if(q>-1)G.deck.splice(q,1)}c.f(S);S.log="You play "+c.n+".";if(S.fhp<=0){S.fhp=0;win()}render()}
function endTurn(){if(S.over)return;S.disc=S.disc.concat(S.hand);S.hand=[];S.fblk=0;var k=S.intent[0],v=S.intent[1];
if(k=="a"){var d=Math.max(0,v-S.blk);S.blk=Math.max(0,S.blk-v);G.hp-=d;S.log=S.foe.n+" hits you for "+d+"."}else{S.fblk+=v;S.log=S.foe.n+" raises a shield ("+v+")."}
if(G.hp<=0){G.hp=0;S.over="lose";render();return}
S.blk=0;S.en=G.en;pick();draw(G.hs);render()}
function win(){if(G.d==DUNGEONS.length-1&&G.r==DUNGEONS[G.d].rooms.length-1){S.over="win";return}var boss=G.r==DUNGEONS[G.d].rooms.length-1;if(boss&&upgradable().length){S.over="upgrade";return}S.over="reward";S.rew=roll(boss)}
function roll(boss){var out=[];while(out.length<3){var x=Math.random(),r=boss?(x<.4?"rare":x<.9?"uncommon":"common"):(x<.07?"rare":x<.35?"uncommon":"common");var p=REWARDS.filter(function(id){return CARDS[id].r==r&&out.indexOf(id)<0});if(p.length)out.push(p[Math.floor(Math.random()*p.length)])}return out}
function take(id){if(id)G.deck.push(id);else heal(5);var D=DUNGEONS[G.d];G.r++;if(G.r>=D.rooms.length){camp();return}fight()}
function cardBtn(id,i){var c=CARDS[id];return '<button class="card '+c.t+' '+c.r+'" onclick="cut('+i+')"><span class="cost">'+c.c+'</span><b>'+c.n+'</b><small>'+c.r+'</small><span class="d">'+c.d+'</span></button>'}
function camp(){var D=DUNGEONS[G.d],can=G.deck.length>6;G.cr=roll(true);app.innerHTML='<div class="top"><h1>Campfire</h1><span class="mute">You cleared '+D.n+' · Health '+G.hp+' / '+G.max+'</span></div>'+HEALTHBAR()+'<div class="stage"><p>Choose one: rest or learn a new card.</p><button class="btn" onclick="rest()">Rest: heal '+Math.round(G.max*.3)+(G.en<5?' and gain 1 energy ('+G.en+' → '+(G.en+1)+')':' (energy is at its maximum)')+'</button></div><div class="stage"><b>Or learn a new card (no healing):</b><div class="hand">'+G.cr.map(cardPick).join("")+'</div></div>'}
function rest(){var b=G.hp,up=G.en<5;heal(Math.round(G.max*.3));if(up)G.en++;G.msg="You rested by the campfire. Healed "+(G.hp-b)+(up?" and your energy grew to "+G.en+".":".");adv()}
function cardPick(id){var c=CARDS[id];return '<button class="card '+c.t+' '+c.r+'" onclick="learn(\''+id+'\')"><span class="cost">'+c.c+'</span><b>'+c.n+'</b><span class="ico">'+ICONS[id]+'</span><small>'+c.r+'</small><span class="d">'+c.d+'</span></button>'}
function learn(id){G.deck.push(id);G.msg="You learned "+CARDS[id].n+".";adv()}
function cut(i){if(G.deck.length<=6)return;G.msg="You removed "+CARDS[G.deck[i]].n+" from your deck.";G.deck.splice(i,1);adv()}
function adv(){G.d++;G.r=0;showMap()}
function showMap(){var h='<div class="top"><h1>Crypt of Cards</h1><span class="mute">'+G.name+' the '+G.cls+' · Health '+G.hp+' / '+G.max+' · Energy '+G.en+' · Deck: '+G.deck.length+'</span></div><p class="log">'+G.msg+'</p><div class="path">';
DUNGEONS.forEach(function(D,i){var st=i<G.d?"done":i==G.d?"now":"lock";
h+=(i?'<div class="link"></div>':'')+'<div class="dg '+st+'">'+dicon(i,D)+'<div><b>'+D.n+'</b><span class="d">Danger '+skulls(i+1)+' · '+D.rooms.length+' rooms · Boss: '+D.rooms[D.rooms.length-1].n+'</span><span class="d">'+(st=="done"?"Cleared ✓":st=="now"?D.t:"Locked")+'</span></div></div>'});
app.innerHTML=h+'</div><button class="btn" onclick="intro()">Enter '+DUNGEONS[G.d].n+'</button>'}
function cardHTML(id,i,play){var c=CARDS[id];return '<button class="card '+c.t+' '+c.r+'" '+(play?'onclick="play('+i+')" '+(c.c>S.en?"disabled":""):'onclick="take(\''+id+'\')"')+'><span class="cost">'+c.c+'</span><b>'+c.n+'</b><span class="ico">'+ICONS[id]+'</span><small>'+c.r+'</small><span class="d">'+c.d+'</span></button>'}
function render(){
var h='<div class="top"><h1>Crypt of Cards</h1><span class="mute">'+G.name+' the '+G.cls+' · '+DUNGEONS[G.d].n+' · Room '+(G.r+1)+' of '+DUNGEONS[G.d].rooms.length+' · Deck: '+G.deck.length+'</span></div>';
if(S.over=="lose"){app.innerHTML=h+'<div class="stage center"><h2>You fell in '+DUNGEONS[G.d].n+'</h2><p class="mute">Every run draws a different hand. Try a new build.</p><button class="btn" onclick="newRun()">Start a new run</button></div>';return}
if(S.over=="win"){app.innerHTML=h+'<div class="stage center"><h2>The crypt is yours!</h2><p class="mute">You defeated the Lich with '+G.hp+' health left and a deck of '+G.deck.length+' cards.</p><button class="btn" onclick="newRun()">Play again</button></div>';return}

if(S.over=="reward"){h+='<div class="stage"><h2>Victory! Pick a new card to add to your deck, or skip to heal 5:</h2><div class="hand">'+S.rew.map(function(id){return cardHTML(id,0,false)}).join("")+'</div><button class="btn ghost" onclick="take()">Skip (heal 5)</button></div>'}
else{h+='<div class="hand">'+S.hand.map(function(id,i){return cardHTML(id,i,true)}).join("")+'</div>';
h+='<div class="stage"><div class="bar me"><i style="width:'+(G.hp/G.max*100)+'%"></i></div><div class="me-row"><span class="stat">Health '+G.hp+' / '+G.max+'</span><span class="stat">Energy '+S.en+' / '+G.en+'</span><span class="stat">Block '+S.blk+'</span>'+(S.str?'<span class="stat">Strength +'+S.str+'</span>':'')+'<span style="flex:1"></span><button class="btn" onclick="endTurn()">End turn</button></div></div>'}

function title(){app.innerHTML='<div class="splash"><h1>Crypt of Cards</h1><p class="mute">A deckbuilding dungeon crawler</p><p class="lore">Long ago, five ancient powers were sealed away beneath the Fallen Realms. Now the seals are failing. Their guardians have been corrupted, and something far older stirs in the dark below.</p><button class="btn" onclick="howto()">Enter world</button></div>'}
function howto(){app.innerHTML='<div class="top"><h1>How to play</h1></div><div class="stage"><h2>Your aim</h2><p>Fight through five dungeons and defeat Nythrakar, the Devourer of Worlds. Every dungeon ends in a boss. If your health reaches 0, your run is over.</p><h2>The basics</h2><ul class="howto"><li><b>Pick a hero:</b> each class starts with different health, energy and cards.</li><li><b>Your hand:</b> you fight with an active hand of cards. Each card can be played once per turn and costs energy, which refreshes every turn.</li><li><b>Enemies:</b> every monster shows its next move, so plan your turn around it.</li><li><b>Armour:</b> armour soaks up damage before your health does, and it lasts for the whole fight.</li><li><b>Swapping:</b> swap cards between your hand and your deck, but it costs your whole turn.</li><li><b>Rewards:</b> after a fight, add a new card to your deck or skip to heal 5. Beat a boss to upgrade one of your cards.</li><li><b>Campfires:</b> after each dungeon, rest to heal and gain energy, or learn a new card.</li><li><b>Rare cards:</b> they are powerful, but are lost from your deck for good once played.</li></ul></div><button class="btn wide" onclick="creation()">Continue</button>'}
var LORE=["Beneath a forgotten kingdom, the tombs of its warrior-kings have been disturbed. The dead walk again, and at their heart lies the first fragment of the ancient seal.",
"As the Hollow King falls, a crack of violet light races through the stone. Far to the north lies Frostheim, a fortress frozen in eternal winter. Its fragment of the seal pulses with the same strange light.",
"Hrothgar’s hammer falls silent, and the frost begins to melt. Deep beneath a sleeping volcano, a demonic portal burns open. The violet light flickers in the flames, brighter than before.",
"Varkul’s blade shatters and the volcano goes quiet, but the corruption has only moved on. In the Dreadwood, the archdruid Eldrath commands the forest itself, and the light grows harder to ignore.",
"With the fourth seal broken, the truth becomes clear. Malgrath, Hrothgar, Varkul and Eldrath were never the true enemy. They were chained to the same ancient being, and every victory has loosened its prison. Above an endless abyss, Nythrakar, the Devourer of Worlds, is awake."];

var SYMALT={sword:"damage",shield:"armour",fist:"strength",leaf:"healing"};
function stag(k){return '<img class="sym" src="'+SYM[k]+'" alt="'+SYMALT[k]+'">'}
Object.keys(ICONS).forEach(function(k){ICONS[k]=ICONS[k].replace(/\u{1F5E1}\uFE0F?/gu,stag("sword")).replace(/\u{1F6E1}\uFE0F?/gu,stag("shield")).replace(/\u270A/g,stag("fist")).replace(/\u{1F343}/gu,stag("leaf"))});
function cicon(c){var k=c.id.toLowerCase();return CI[k]?'<img class="cpic" src="'+CI[k]+'" alt="">':'<span class="face">'+c.e+'</span>'}
var HPM=1.3,DMM=1.2;
function fight(){var D=DUNGEONS[G.d],f=D.rooms[G.r],d=shuffle(G.deck.slice()),n=G.hs+(G.x0||0);S={foe:f,fhp:Math.round(f.hp*HPM),mx:Math.round(f.hp*HPM),fblk:0,blk:G.b0,str:G.str0,en:G.en,hand:d.splice(0,n).map(function(id){return{id:id,u:0}}),res:d,swap:0,so:[],si:[],log:(f.rm?f.rm+": ":"")+f.n+" blocks your path.",over:null};pick();render()}
function pick(){var m=S.foe.m;if(S.bcd>0)S.bcd--;var pool=S.bcd>0?m.filter(function(x){return x[0]=="a"}):m;if(!pool.length)pool=m;var x=pool[Math.floor(Math.random()*pool.length)];if(x[0]=="b")S.bcd=3;S.intent=[x[0],Math.round(x[1]*DMM)]}
function draw(n){for(var i=0;i<n&&S.res.length;i++)S.hand.push({id:S.res.pop(),u:0,t:1})}
function play(i){var h=S.hand[i],c=CARDS[h.id];if(h.u||c.c>S.en||S.over||S.swap)return;S.en-=c.c;h.u=1;S.pl=1;if(c.x){var q=G.deck.indexOf(h.id);if(q>-1)G.deck.splice(q,1);if(h.t||!S.res.length)S.hand.splice(i,1);else S.hand[i]={id:S.res.pop(),u:0}}c.f(S);S.log="You play "+c.n+".";if(S.fhp<=0){S.fhp=0;win()}render()}
function endTurn(pre){if(S.over)return;var p=pre||"";S.swap=0;var k=S.intent[0],v=S.intent[1];
if(k=="a"){var d=Math.max(0,v-S.blk);S.blk=Math.max(0,S.blk-v);G.hp-=d;S.log=p+S.foe.n+" hits you for "+d+"."}else{S.fblk+=v;S.log=p+S.foe.n+" gains "+v+" armour."}
if(G.hp<=0){G.hp=0;S.over="lose";render();return}
S.en=G.en;S.pl=0;S.hand=S.hand.filter(function(x){x.u=0;if(x.t){S.res.push(x.id);return false}return true});pick();render()}
function swapMode(){if(S.over)return;S.swap=!S.swap;S.so=[];S.si=[];render()}
function tog(a,i){var p=a.indexOf(i);if(p>-1)a.splice(p,1);else if(a.length<3)a.push(i);render()}
function selHand(i){tog(S.so,i)}
function selRes(i){tog(S.si,i)}
function doSwap(){var n=S.so.length;if(!n||n!=S.si.length)return;for(var k=0;k<n;k++){var o=S.hand[S.so[k]],ri=S.si[k],nid=S.res[ri];S.res[ri]=o.id;S.hand[S.so[k]]={id:nid,u:0}}S.res=S.res.filter(function(x){return x});endTurn("You swapped "+n+" card"+(n>1?"s":"")+" and lost your turn. ")}
function handBtn(h,i){var c=CARDS[h.id],sw=S.swap,on=sw&&S.so.indexOf(i)>-1,dis=sw?false:(h.u||c.c>S.en);return '<button class="card '+c.t+' '+c.r+(h.u?' used':'')+(on?' sel':'')+'" onclick="'+(sw?'selHand':'play')+'('+i+')"'+(dis?' disabled':'')+'><span class="cost">'+c.c+'</span><b>'+c.n+'</b><span class="ico">'+ICONS[h.id]+'</span><small>'+(h.u?'used this turn':c.r)+'</small><span class="d">'+c.d+'</span></button>'}
function resBtn(id,i){var c=CARDS[id],on=S.si.indexOf(i)>-1;return '<button class="card mini '+c.t+' '+c.r+(on?' sel':'')+'" onclick="selRes('+i+')"'+(S.swap?'':' disabled')+'><span class="cost">'+c.c+'</span><b>'+c.n+'</b><span class="ico">'+ICONS[id]+'</span><small>'+c.r+'</small><span class="d">'+c.d+'</span></button>'}
function render(){var D=DUNGEONS[G.d],h='<div class="top"><h1>Crypt of Cards</h1><span class="mute">'+G.name+' the '+G.cls+' · '+D.n+' · Room '+(G.r+1)+' of '+D.rooms.length+' · Deck: '+G.deck.length+'</span></div>';
if(S.over=="lose"){app.innerHTML=h+'<div class="stage center"><h2>You fell in '+D.n+'</h2><p class="mute">Every run deals a different set of cards. Try a new build.</p><button class="btn" onclick="newRun()">Start a new run</button></div>';return}
if(S.over=="win"){app.innerHTML=h+'<div class="stage center"><h2>The Devourer is slain!</h2><p class="mute">You defeated Nythrakar with '+G.hp+' health left and a deck of '+G.deck.length+' cards.</p><button class="btn" onclick="newRun()">Play again</button></div>';return}
var f=S.foe,k=S.intent[0],it=k=="a"?"Will attack for "+S.intent[1]:"Will gain "+S.intent[1]+" armour";
h+='<div class="stage"><div class="foe">'+portrait(f)+'<div style="flex:1"><h2>'+f.n+'</h2>'+(S.fblk>0?'<div class="rowh"><b>Armour</b><span class="stat">'+S.fblk+'</span></div><div class="bar armor" role="progressbar" aria-label="Boss armour" aria-valuemin="0" aria-valuemax="'+S.mx+'" aria-valuenow="'+S.fblk+'"><i style="width:'+Math.min(100,S.fblk/S.mx*100)+'%"></i></div>':'')+'<div class="bar"><i style="width:'+(S.fhp/S.mx*100)+'%"></i></div><div>'+S.fhp+' / '+S.mx+' health</div>'+(S.over?'':'<div class="intent">'+it+'</div>')+'</div></div></div><div class="log" aria-live="polite">'+S.log+'</div>';
if(S.over=="upgrade"){h+='<div class="stage"><h2>Boss defeated! Upgrade one card in your deck:</h2><div class="hand">'+upgradable().map(upBtn).join("")+'</div></div>';app.innerHTML=h;return}
if(S.over=="reward"){h+='<div class="stage"><h2>Victory! Pick a new card to add to your deck, or skip to heal 5:</h2><div class="hand">'+S.rew.map(function(id){return cardHTML(id,0,false)}).join("")+'</div><button class="btn ghost" onclick="take()">Skip (heal 5)</button></div>';app.innerHTML=h;return}
h+=PLAYER()+(S.swap?'<p><b>Swap mode:</b> pick up to 3 cards from your hand and the same number from your deck. Swapping costs your whole turn.</p>':'')+'<div class="stage active"><b>Active hand ('+S.hand.length+')</b> <span class="mute">the cards you can play this turn</span><div class="hand">'+S.hand.map(handBtn).join("")+'</div></div>';
h+='<div class="stage"><div class="rowh"><b>Deck ('+S.res.length+')</b>'+SWAPBTN()+'</div>'+(S.res.length?'<div class="hand">'+S.res.map(resBtn).join("")+'</div>':'<p class="mute">No other cards in your deck.</p>')+'</div>';
h+=(S.swap?'<button class="btn wide" onclick="doSwap()"'+(S.so.length&&S.so.length==S.si.length?'':' disabled')+'>Swap '+S.so.length+' card'+(S.so.length==1?'':'s')+' and end turn</button>':'<button class="btn wide" onclick="endTurn()">End turn</button>');
app.innerHTML=h}
title();
</script>
</body>
</html>
